# Quarantine legacy startup. Use scripts/start-local-safe.ps1.
services:
  postgres:
    image: pgvector/pgvector:pg15
    build: !reset null
    pull_policy: never
    entrypoint: ["/bin/sh", "-c", "echo LOCAL_SAFE_MODE: legacy service quarantined; exit 78"]
    command: !reset []
    network_mode: none
    networks: !reset []
    ports: !reset []
    depends_on: !reset {}
    restart: "no"
    healthcheck:
      disable: true
